#############################################################################################
# pre-commit — language-agnostic hooks for this (non-python) API repo.                       #
# see https://pre-commit.com/#intro for an introduction to pre-commit                        #
#                                                                                            #
# This repo has NO python source: it ships .proto definitions plus generated API docs.       #
# Language-specific tooling is NOT run here (no ruff/mypy/uv/flake8/autopep8).                #
#############################################################################################

# Never touch generated / vendored code:
#   docs/            -> generated by the CI "Generate API Documentation" workflow
#   google/          -> vendored googleapis proto tree + its READMEs
#   ondewo-*-api/    -> git submodules (nlu / s2t / t2s)
#   *.pb.* / *_pb2*  -> generated protobuf stubs (none checked in today, guarded anyway)
exclude: '^(docs/|google/|ondewo-nlu-api/|ondewo-s2t-api/|ondewo-t2s-api/)|(\.pb\.[^/]+$|_pb2\.pyi?$|_pb2_grpc\.py$)'

fail_fast: false

repos:

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [ maxkb=1024 ]
      - id: check-json          # validate (does NOT reformat) json/package.json
      - id: check-yaml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]

  - repo: https://github.com/milin/giticket
    rev: '1.92'
    hooks:
      - id: giticket
        args: [ '--regex=(?:(?:feature|bugfix|support|hotfix)/)?(OND[0-9]{3}-[0-9]{1,5})[_-][\w-]+',
                '--format=[{ticket}] {commit_msg}',
                '--mode=regex_match' ]
