syntax = "proto3";

package ondewo.csi;
import "google/protobuf/empty.proto";
import "google/rpc/status.proto";
import "google/protobuf/struct.proto";
import "ondewo/nlu/session.proto";
import "ondewo/t2s/text-to-speech.proto";
import "ondewo/s2t/speech-to-text.proto";
import "ondewo/nlu/context.proto";

// <p>Endpoints of CSI service.</p>
service Conversations {
    // <p>Create the S2S pipeline specified in the request message. The pipeline with the specified ID must not exist.</p>
    //
    // <p>Examples:</p>
    //
    // <pre>
    // grpcurl -plaintext -d '{
    //   "id": "pizza",
    //   "s2t_pipeline_id": "default_german",
    //   "nlu_project_id": "1f3425d2-41fd-4970-87e6-88e8e121bb49",
    //   "nlu_language_code": "de",
    //   "t2s_pipeline_id": "default_german"
    // }' localhost:50051 ondewo.csi.Conversations.CreateS2sPipeline
    // </pre>
    // <samp>{}</samp>
    rpc CreateS2sPipeline (S2sPipeline) returns (google.protobuf.Empty) {};

    // <p>Retrieve the S2S pipeline with the ID specified in the request message.</p>
    //
    // <p>Examples:</p>
    //
    // <pre>
    // grpcurl -plaintext -d '{"id": "pizza"}' localhost:50051 ondewo.csi.Conversations.GetS2sPipeline
    // </pre>
    // <samp>{
    //   "id": "pizza",
    //   "s2t_pipeline_id": "default_german",
    //   "nlu_project_id": "1f3425d2-41fd-4970-87e6-88e8e121bb49",
    //   "nlu_language_code": "de",
    //   "t2s_pipeline_id": "default_german"
    // }
    // </samp>
    rpc GetS2sPipeline (S2sPipelineId) returns (S2sPipeline) {};

    // <p>Update the S2S pipeline specified in the request message. The pipeline must exist.</p>
    //
    // <p>Examples:</p>
    //
    // <pre>
    // grpcurl -plaintext -d '{
    //   "id": "pizza",
    //   "s2t_pipeline_id": "default_german",
    //   "nlu_project_id": "1f3425d2-41fd-4970-87e6-88e8e121bb49",
    //   "nlu_language_code": "en",
    //   "t2s_pipeline_id": "default_german"
    // }' localhost:50051 ondewo.csi.Conversations.UpdateS2sPipeline
    // </pre>
    // <samp>{}</samp>
    rpc UpdateS2sPipeline (S2sPipeline) returns (google.protobuf.Empty) {};

    // <p>Delete the S2S pipeline with the ID specified in the request message. The pipeline must exist.</p>
    //
    // <p>Examples:</p>
    //
    // <pre>
    // grpcurl -plaintext -d '{"id": "pizza"}' localhost:50051 ondewo.csi.Conversations.DeleteS2sPipeline
    // </pre>
    // <samp>{}</samp>
    rpc DeleteS2sPipeline (S2sPipelineId) returns (google.protobuf.Empty) {};

    // <p>List all S2S pipelines of the server.</p>
    //
    // <p>Examples:</p>
    //
    // <pre>
    // grpcurl -plaintext localhost:50051 ondewo.csi.Conversations.ListS2sPipelines
    // </pre>
    // <samp>{
    //   "pipelines": [
    //     {
    //       "id": "pizza",
    //       "s2t_pipeline_id": "default_german",
    //       "nlu_project_id": "1f3425d2-41fd-4970-87e6-88e8e121bb49",
    //       "nlu_language_code": "de",
    //       "t2s_pipeline_id": "default_german"
    //     }
    //   ]
    // }</samp>
    rpc ListS2sPipelines (ListS2sPipelinesRequest) returns (ListS2sPipelinesResponse) {};

    // <p>Processes a natural language query in audio format in a streaming fashion and returns structured, actionable data as a result.</p>
    rpc S2sStream (stream S2sStreamRequest) returns (stream S2sStreamResponse) {};

    // <p>Check the health of S2T, NLU and T2S servers.</p>
    //
    // <p>Examples:</p>
    //
    // <pre>
    // grpcurl -plaintext localhost:50051 ondewo.csi.Conversations.CheckUpstreamHealth
    // </pre>
    //
    // All upstreams healthy:
    // <samp>{}</samp>
    //
    // All upstreams unhealthy:
    // <samp>{
    //   "s2t_status": {
    //     "code": 14,
    //     "message": "failed to connect to all addresses"
    //   },
    //   "nlu_status": {
    //     "code": 14,
    //     "message": "failed to connect to all addresses"
    //   },
    //   "t2s_status": {
    //     "code": 14,
    //     "message": "failed to connect to all addresses"
    //   }
    // }</samp>
    rpc CheckUpstreamHealth(google.protobuf.Empty) returns (CheckUpstreamHealthResponse) {};

    // <p>Get the control stream to control sip, t2s, s2t etc. during a conversation.</p>
    rpc GetControlStream (ControlStreamRequest) returns (stream ControlStreamResponse) {};

    // <p>Send a message on the control stream to control sip, t2s, s2t etc. during a conversation.</p>
    rpc SetControlStatus (SetControlStatusRequest) returns (SetControlStatusResponse) {};

    // <p>Set the per-call operator media control level: mute the bot and/or pause its listening.</p>
    //
    // <p>Pushed by ondewo-sip only, which owns the per-call level and authenticates with its in-container token
    // (the <code>x-ondewo-sip-in-container-token</code> metadatum). A request without a valid token is refused.</p>
    //
    // <p>The request carries the FULL effective level, never a toggle. The server applies it only when its
    // <code>generation</code> is strictly greater than the last applied generation and otherwise answers
    // <code>stale=true</code> without changing anything, so a push that arrives after the next call's resync can
    // never re-apply an old call's level. The level is cleared at <code>CALL_ENDED</code>; the generation is kept.</p>
    //
    // <p>This RPC never changes the control status of <code>GetControlStream</code> / <code>SetControlStatus</code>
    // (the barge-in slot). A level change is announced on the control stream as a
    // <code>ControlStreamResponse</code> with <code>media_control</code> set.</p>
    rpc SetCallMediaControl (CallMediaControlLevel) returns (SetCallMediaControlResponse) {};

    // <p>Report one DTMF key the caller pressed on the current call.</p>
    //
    // <p>Sent by ondewo-sip only, one request per key in the order received, authenticated with its in-container
    // token (the <code>x-ondewo-sip-in-container-token</code> metadatum). A request without a valid token is refused
    // with <code>UNAUTHENTICATED</code>.</p>
    //
    // <p>The server turns keys into caller input: a key pressed while the bot speaks is a barge-in, a key of a
    // declared menu commits a turn at once, and a key string is collected until its terminator, its maximum length
    // or its inter-digit timeout. A key of another call, a repeated or older sequence number, or a key while the
    // server takes no keys is answered <code>accepted=false</code> with a reason token and changes nothing. Neither
    // side ever logs the digit in clear.</p>
    rpc SetCallerDtmf (CallerDtmfRequest) returns (CallerDtmfResponse) {};

}

// The top-level message sent by client to <code>CreateS2sPipeline</code> and <code>UpdateS2sPipeline</code> endpoints and received from <code>GetS2sPipeline</code> endpoint.
message S2sPipeline {

    // Required. CSI pipeline identifier consisting of S2T, NLU and T2S configuration. ID can be any non-empty string.
    string id = 1;

    // Required. S2T pipeline ID, e.g. "german_general"
    string s2t_pipeline_id = 2;

    // Required. NLU project ID, usually a hash, e.g. "ae33586b-x2s2-494a-aa73-1af0589cfc56".
    string nlu_project_id = 3;

    // Required. Language code present in the corresponding NLU project, e.g. "de".
    string nlu_language_code = 4;

    // Required. T2S pipeline ID, e.g. "kerstin".
    string t2s_pipeline_id = 5;

}

// The top-level message sent by client to <code>GetS2sPipeline</code> and <code>DeleteS2sPipeline</code> endpoints.
message S2sPipelineId {

    // Required. CSI pipeline identifier.
    string id = 1;

}

// The top-level message sent by client to <code>ListS2sPipelines</code> endpoint. Currently without arguments.
message ListS2sPipelinesRequest {
    // TODO: add filtering options
}

// The top-level message received from <code>ListS2sPipelines</code> endpoint.
message ListS2sPipelinesResponse {

    // Collection of S2S pipelines of the server.
    repeated S2sPipeline pipelines = 1;

}

// The top-level message sent by the client to the <code>S2sStream</code> method.
// Multiple request messages should be sent in order:
// <ul>
//   <li>The first message must contain <code>pipeline_id</code> and can contain <code>session_id</code> or <code>initial_intent_display_name</code>. The message must not contain <code>audio</code> nor <code>end_of_stream</code>.</li>
//   <li>All subsequent messages must contain <code>audio</code>. If <code>end_of_stream</code> is <code>true</code>, the stream is closed.</li>
// </ul>
message S2sStreamRequest {

    // Optional. The CSI pipeline ID specified in the initial request.
    string pipeline_id = 1;

    // <p>Optional. The session or call ID specified in the initial request. It&apos;s up to the API caller to choose an appropriate string. It can be a random number or some type of user identifier (preferably hashed).</p>
    string session_id = 2;

    // Optional. The input audio content to be recognized.
    bytes audio = 3;
    // If <code>true</code>, the recognizer will not return any further hypotheses about this piece of the audio. May only be populated for <code>event_type</code> = <code>RECOGNITION_EVENT_TRANSCRIPT</code>.
    bool end_of_stream = 4;

    // Optional. Intent display name to trigger in NLU system in the beginning of the conversation.
    string initial_intent_display_name = 5;

}

// The top-level message returned from the <code>S2sStream</code> method.
// A response message is returned for each utterance of the input stream. It contains the full response from NLU system in <code>detect_intent_response</code> or the full T2S response in <code>synthesize_response</code>.
// Multiple response messages can be returned in order:
// <ul>
//   <li>The first response message for an input utterance contains response from NLU system <code>detect_intent_response</code> with detected intent and N fulfillment messages (N &gt;= 0).</li>
//   <li>The next N response messages contain for each fulfillment message one of the following:
//     <ul>
//       <li>T2S response <code>synthesize_response</code> with synthesized audio</li>
//       <li>SIP trigger message <code>sip_trigger</code> with SIP trigger extracted from the fulfillment message</li>
//     </ul>
//   </li>
// </ul>
message S2sStreamResponse {

    // Response type for the S2S stream. One of the following will be populated.
    oneof response {

        // full NLU detect intent response
        ondewo.nlu.DetectIntentResponse detect_intent_response = 1;

        // full T2S synthesize response
        ondewo.t2s.SynthesizeResponse synthesize_response = 2;

        // SIP trigger message
        SipTrigger sip_trigger = 3;
    }

    // Optional. Identifier of the utterance this response belongs to. All chunks of one synthesized utterance share the same <code>utterance_id</code>
    string utterance_id = 4;

    // Optional. Zero-based index of this chunk within the utterance identified by <code>utterance_id</code>
    int32 chunk_index = 5;

    // Optional. If <code>true</code>, this is the last chunk of the utterance identified by <code>utterance_id</code>
    bool last_chunk = 6;

    // Optional. Monotonic turn epoch of the conversation turn that produced this response. Used by consumers to fence stale audio of an interrupted turn
    uint64 turn_epoch = 7;

    // <p>Optional. One-based sequence number of this response on its <code>S2sStream</code>, assigned by the server
    // when it yields the response and counted over EVERY response of the stream (audio, NLU and SIP trigger), so it
    // is independent of whether anything is stored or framed. <code>0</code> means the server does not number its
    // responses (an older server).</p>
    //
    // <p>It names a response that has no <code>utterance_id</code> (the greeting, a merged utterance, a filler,
    // the apology) in <code>PlaybackCut.response_sequence</code> and in a <code>PLAYBACK_DONE</code> report.</p>
    uint64 response_sequence = 8;

}

// SIP trigger message.
message SipTrigger {

    // Type of SIP trigger that can be executed during a conversation.
    enum SipTriggerType {

        // should never be used
        UNSPECIFIED = 0;

        // hard hangup
        HANGUP = 1;

        // handover to human
        HUMAN_HANDOVER = 2;

        // send now
        SEND_NOW = 3;

        // pause
        PAUSE = 4;

        // transfer
        TRANSFER = 5;

        // invite to conference call. NOT IMPLEMENTED: ondewo-csi cannot reach ondewo-vtsi, which owns call
        // participants. Invite a softphone with the ondewo-vtsi <code>Calls.InviteToCall</code> RPC instead
        INVITE = 6;

        // play audio
        PLAY_AUDIO = 7;

    }

    // Type of the SIP trigger.
    SipTriggerType type = 1;

    // extra parameters for the trigger
    google.protobuf.Struct content = 2;

}

// Health checks.
message CheckUpstreamHealthResponse {

    // Health checks for Speech-2-Text
    google.rpc.Status s2t_status = 1;

    // Health checks for NLU
    google.rpc.Status nlu_status = 2;

    // Health checks for Text-2-Speech
    google.rpc.Status t2s_status = 3;

}

// Control stream message.
message ControlStreamRequest{}

// Control status.
enum ControlStatus {

    // Status that control stream is ok
    OK = 0;

    // Status that control stream needs to stop immediately
    EMERGENCY_STOP = 1;

    // Status that voice activity detection detected start of speech
    VAD_START_OF_SPEECH = 2;

    // Status that the caller started speaking while the bot was speaking (barge-in): playback pauses and the un-played audio remainder is buffered
    BARGE_IN = 3;

    // Status sent by the server to the client to resume playback of the buffered audio remainder after a false interruption (no committed transcription final arrived within the false interruption timeout)
    RESUME_PLAYBACK = 4;

    // Status sent by the server to the client to discard the buffered audio remainder because the interruption committed as a real turn
    DISCARD_REMAINDER = 5;

    // Status reported by the client to the server via <code>SetControlStatus</code> that playback of the buffered audio remainder has resumed
    PLAYBACK_RESUMED = 6;

    // Status reported by the client to the server via <code>SetControlStatus</code> that playback of an utterance has completed
    PLAYBACK_DONE = 7;

    // Status reported by ondewo-sip to the server via <code>SetControlStatus</code> that the phone call has ENDED and the server must reset ALL per-call state in place (persistent-listener model). It is a command, not a state: it is never pushed onto the control stream
    CALL_ENDED = 8;

    // <p>Status reported by the client to the server via <code>SetControlStatus</code>, with
    // <code>SetControlStatusRequest.playback_cut</code> set, after it aborted playback for a <code>BARGE_IN</code>
    // whose <code>ControlStreamResponse</code> carried a non-zero <code>playback_cut_request_id</code>. It reports
    // how much of the cut audio the caller can have heard.</p>
    //
    // <p>Like <code>CALL_ENDED</code> it is a report, not a state: the server never assigns it to the control status,
    // never pushes it onto the control stream and leaves a pending <code>BARGE_IN</code> latched. The request must
    // carry the in-container token (the <code>x-ondewo-sip-in-container-token</code> metadatum). A client sends it
    // only after reading a non-zero <code>playback_cut_request_id</code>, so a server that does not consume cuts
    // never receives it.</p>
    //
    // <p>How the server answers, checked in this order:</p>
    // <ul>
    //   <li>Token missing or not equal to the server's: <code>UNAUTHENTICATED</code>, nothing is recorded. A
    //   server with NO token configured (a standalone server, or one relaunched without its token) refuses every
    //   cut this way and never requests one: it sends <code>playback_cut_request_id = 0</code> and keeps its own
    //   estimate. The client must not retry an <code>UNAUTHENTICATED</code> cut.</li>
    //   <li><code>playback_cut</code> not set: <code>INVALID_ARGUMENT</code>, nothing is recorded. The client must
    //   not retry it.</li>
    //   <li><code>playback_cut_request_id</code> not pending on the current control stream (zero, unknown, already
    //   answered, superseded by a newer <code>BARGE_IN</code>, from a previous stream or a previous call): OK, the
    //   cut is dropped and the server keeps its own estimate.</li>
    //   <li>Otherwise: OK, the cut is recorded and the id stops being pending.</li>
    // </ul>
    //
    // <p>An OK answer carries the control status the server holds, unchanged:
    // <code>old_control_status == new_control_status</code>, in practice <code>BARGE_IN</code> while it is still
    // latched. It does not say whether the cut was recorded or dropped; nothing on the client depends on that.
    // Any other status (<code>UNAVAILABLE</code>, <code>DEADLINE_EXCEEDED</code>, ...) means the cut may or may not
    // have arrived; the client may retry it with the same <code>playback_cut_request_id</code>, because a second copy
    // of an answered id is dropped.</p>
    PLAYBACK_CUT = 9;

}

// Control stream response message.
message ControlStreamResponse{

    // Control status
    ControlStatus control_status = 1;

    // Monotonic barge-in epoch/sequence number so control status transitions are correlatable with the <code>S2sStreamResponse</code> <code>turn_epoch</code> and a second barge-in during a resumed remainder can never be coalesced away
    uint64 epoch = 2;

    // <p>Optional. The per-call operator media control level. Set ONLY on media-control messages: pushed when the
    // level changes (<code>SetCallMediaControl</code>) and sent as the seed on every <code>GetControlStream</code>
    // connect.</p>
    //
    // <p>A message that has this field set is a media-control message and nothing else: a client must handle it
    // and must NOT read its <code>control_status</code> / <code>epoch</code> as a control status transition. The
    // server echoes the current control status and epoch in it, but a client that applied that
    // <code>control_status</code> (e.g. <code>OK</code>) would un-latch a pending <code>BARGE_IN</code>.
    // Messages without this field keep their meaning unchanged.</p>
    CallMediaControlLevel media_control = 3;

    // <p>Optional. Non-zero only on a <code>BARGE_IN</code> transition sent by a server that consumes
    // <code>PlaybackCut</code>: the server asks the client to report the cut with <code>PLAYBACK_CUT</code> and to
    // echo this value in <code>PlaybackCut.playback_cut_request_id</code>. The value is the server's
    // process-lifetime, never rewound sequence number of that transition, so every barge-in (including a second one
    // during a resumed remainder, which keeps its epoch) has its own id.</p>
    //
    // <p><code>0</code> means no cut is requested: an older server, a server with no in-container token
    // configured, the seed of a new control stream, a media-control message, or any status other than
    // <code>BARGE_IN</code>.</p>
    uint64 playback_cut_request_id = 4;

}

// Request to set control status.
message SetControlStatusRequest{

    // Control status
    ControlStatus control_status = 1;

    // Optional. Set if and only if <code>control_status</code> is <code>PLAYBACK_CUT</code>. A
    // <code>PLAYBACK_CUT</code> without it is answered <code>INVALID_ARGUMENT</code>; any other status ignores it
    PlaybackCut playback_cut = 2;

    // <p>Optional. Set only with <code>PLAYBACK_DONE</code>: the <code>S2sStreamResponse.utterance_id</code> of the
    // utterance whose playback completed. Empty for a response that carries no <code>utterance_id</code>; that one
    // is named by <code>response_sequence</code>.</p>
    string utterance_id = 3;

    // <p>Optional. Set only with <code>PLAYBACK_DONE</code>: the <code>S2sStreamResponse.response_sequence</code> of
    // the last response of the completed utterance. <code>0</code> if the server does not number its responses.</p>
    uint64 response_sequence = 4;

}

// <p>Where playback stood when the client aborted it for a <code>BARGE_IN</code>, reported with
// <code>PLAYBACK_CUT</code>. All audio positions refer to the response named by <code>utterance_id</code> /
// <code>response_sequence</code> and are measured by the client on the thread that owns the audio connection.</p>
//
// <p>The client reports raw values only. The server computes the played prefix in one place as
// <code>written_audio_us - min(queued_audio_us, written_audio_us)</code>: the audio handed to the audio device
// minus the audio that was still queued in it and was flushed.</p>
message PlaybackCut {

    // The <code>ControlStreamResponse.playback_cut_request_id</code> of the <code>BARGE_IN</code> this cut answers.
    // The server records a cut only while this id is pending on the current stream; any other id is answered OK and
    // dropped (see <code>PLAYBACK_CUT</code>)
    uint64 playback_cut_request_id = 1;

    // The <code>ControlStreamResponse.epoch</code> of that <code>BARGE_IN</code>
    uint64 barge_in_epoch = 2;

    // The <code>S2sStreamResponse.utterance_id</code> playing at the cut. Empty if that response has none, or if
    // nothing was playing
    string utterance_id = 3;

    // The <code>S2sStreamResponse.chunk_index</code> playing at the cut
    int32 chunk_index = 4;

    // The <code>S2sStreamResponse.response_sequence</code> playing at the cut. <code>0</code> if nothing was playing
    // or the server does not number its responses
    uint64 response_sequence = 5;

    // Microseconds of audio of that utterance (or of that single response, if it has no <code>utterance_id</code>)
    // handed to the audio device since it started playing, across a resumed remainder
    int64 written_audio_us = 6;

    // Microseconds of audio still queued in the audio device at the cut, read once just before the queue was
    // flushed. If the device latency could not be read, the client sends its configured target buffer length
    // instead and sets <code>queued_audio_estimated</code>
    int64 queued_audio_us = 7;

    // <code>true</code> if <code>queued_audio_us</code> is the configured target buffer length rather than a
    // latency read
    bool queued_audio_estimated = 8;

    // <code>CLOCK_MONOTONIC</code> time of the cut in nanoseconds. The client runs on the same host as the server,
    // so the server can compare it with its own monotonic clock
    int64 cut_monotonic_ns = 9;

    // <code>true</code> if the client kept the un-played remainder so that <code>RESUME_PLAYBACK</code> can play it
    bool remainder_held = 10;

}

// Response of setting the control status with the old and new status objects. For a report that is not a state
// (<code>PLAYBACK_CUT</code>) both fields carry the status the server holds, unchanged.
message SetControlStatusResponse{

    // Previous 'old' control status
    ControlStatus old_control_status = 1;

    // Current 'new' control status
    ControlStatus new_control_status = 2;

}

// <p>Per-call operator media control level, sent by ondewo-sip to <code>SetCallMediaControl</code> and pushed by the
// server on the control stream (<code>ControlStreamResponse.media_control</code>).</p>
//
// <p>It always carries the FULL effective level. It is independent of the bot's own mixer mute that ondewo-csi
// requests from ondewo-sip with <code>SipMute</code> / <code>SipUnMute</code>.</p>
message CallMediaControlLevel {

    // <p>If <code>true</code>, the bot is muted: no text-to-speech is synthesized for new responses (the NLU turn
    // still runs), the in-flight utterance is aborted and discarded (never resumed), and soft-timeout fillers,
    // re-prompts and <code>PLAY_AUDIO</code> triggers produce no audio.</p>
    bool bot_muted = 1;

    // <p>If <code>true</code>, the bot stops listening: the caller audio sent to speech-to-text is replaced by muted
    // zero frames at the capture cadence (the stream stays open and its clock stays aligned with the call), S2T
    // responses are dropped before barge-in adjudication and before NLU, and the turn, soft and silence
    // timers are suspended (they restart from zero on resume). Blanked audio is never back-filled.</p>
    bool listening_paused = 2;

    // <p>ondewo-sip's container-lifetime monotonic counter. Never reset per call. The server applies a level only
    // when this value is strictly greater than the last applied one.</p>
    uint64 generation = 3;

    // <p>Bounded reason token for logs and telemetry: <code>operator</code>, <code>participant</code>,
    // <code>takeover</code> or <code>resync</code>.</p>
    string reason = 4;

}

// <p>Response of <code>SetCallMediaControl</code>.</p>
message SetCallMediaControlResponse {

    // <p>The level the server holds after this request.</p>
    CallMediaControlLevel applied = 1;

    // <p><code>true</code> if the effective level changed.</p>
    bool changed = 2;

    // <p><code>true</code> if the request's generation was not greater than the last applied generation. The
    // request was ignored.</p>
    bool stale = 3;

    // <p><code>true</code> while an utterance is still draining to the caller.</p>
    bool bot_playback_in_flight = 4;

    // <p>Empty when the level was applied. Otherwise a stable refusal token: <code>amd-in-progress</code>
    // (<code>listening_paused</code> refused during the answering-machine-detection window).</p>
    string refusal_reason = 5;

}

// <p>One DTMF key the caller pressed, sent by ondewo-sip to <code>SetCallerDtmf</code>.</p>
message CallerDtmfRequest {

    // <p>ondewo-sip's id of the call the key belongs to (<code>SipStatus.call_id</code>). A key of another call
    // than the server's current one is refused.</p>
    string call_id = 1;

    // <p>1 for the first key of the call, then +1 per key ondewo-sip admitted. A sequence number not greater than
    // the last one accepted for the call is refused.</p>
    uint64 sequence = 2;

    // <p>The key: one of <code>0</code>-<code>9</code>, <code>*</code>, <code>#</code>, <code>A</code>-<code>D</code>.
    // Never logged in clear.</p>
    string digit = 3;

    // <p>How long the key was held, in milliseconds; 0 when unknown.</p>
    uint32 duration_ms = 4;

    // <p>When ondewo-sip received the key, in nanoseconds since the Unix epoch (for the key-to-audio latency).</p>
    int64 received_unix_ns = 5;

}

// <p>Response of <code>SetCallerDtmf</code>.</p>
message CallerDtmfResponse {

    // <p><code>true</code> if the server took the key as caller input.</p>
    bool accepted = 1;

    // <p>Empty when accepted. Otherwise a stable token: <code>disabled</code>, <code>no-call</code>,
    // <code>other-call</code>, <code>stale-sequence</code>, <code>invalid-digit</code>, <code>listening-paused</code>,
    // <code>amd-in-progress</code> or <code>undeclared</code>.</p>
    string reason = 2;

}

// Control message services.
enum ControlMessageServiceName {

    // Unknown control message service name
    UNKNOWNNAME = 0;

    // Speech-2-Text control message service name
    ondewo_s2t = 1;

    // Text-2-Speech control message service name
    ondewo_t2s = 2;

    // NLU control message service name
    ondewo_nlu = 3;

    // SIP control message service name
    ondewo_sip = 4;

    // VTSI control message service name
    ondewo_vtsi = 5;

    // CSI control message service name
    ondewo_csi = 6;

    // Survey control message service name
    ondewo_survey = 7;
}

